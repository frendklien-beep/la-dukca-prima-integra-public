[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "la-dukca-prima-integra-backend"
version = "0.5.0"
description = "Backend FastAPI untuk La Dukca PRIMA Integra"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18.5,<1.19",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28.1,<1",
    "numpy>=2.5,<2.6",
    "openai>=2.46,<3",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.14,<2.15",
    "pwdlib[argon2]>=0.3,<0.4",
    "python-multipart>=0.0.32,<0.1",
    "pymupdf>=1.28,<1.29",
    "sqlalchemy>=2.0.51,<2.1",
    "tiktoken>=0.13,<0.14",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1",
    "httpx2>=2.13.1,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
